<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Perdium Demon Slayer — Loading</title>

    <!-- Police plus "anime" -->
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/sleek.css">
</head>
<body>
    <!-- Lecteur YouTube caché -->
    <div id="player"></div>

    <!-- Overlay assombrissant + texture -->
    <div id="overlay"></div>

    <!-- Logo / Nom du serveur (rempli par config.js + main.js) -->
    <div id="title"></div>

    <!-- Sous-titre Demon Slayer -->
    <div id="subtitle">
        Serveur Demon Slayer — <span id="gamemode"></span> — Carte : <span id="map"></span>
    </div>

    <!-- Kanji décoratif -->
    <div id="kanji"></div>

    <!-- Statut et barre de chargement -->
    <div id="status-container">
        <div id="status">Connexion au Domaine des Pourfendeurs...</div>
        <div id="loading">
            <div id="loading-progress"></div>
        </div>
        <div id="messages"></div>
    </div>

    <!-- Musique -->
    <div id="music">
        Vous écoutez actuellement<div id="music-name"></div>
    </div>

    <script src="js/lib/jquery-3.7.1.min.js"></script>
    <script src="js/lib/jquery.backstretch.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
