<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Perdium Demon Slayer — Loading</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/sleek.css">
</head>

<body>

    <div id="background-overlay"></div>
    <div id="overlay" style="display:none;"></div>

    <div id="kanji"></div>

    <div id="panel">
        <div id="logo"></div>

        <div id="server-info">
            <div class="info-group">
                <div class="label">Mode de jeu</div>
                <div class="value" id="gamemode">Recherche...</div>
            </div>
            <div class="info-group">
                <div class="label">Carte chargée</div>
                <div class="value" id="map">Inconnue</div>
            </div>
        </div>

        <div id="status">En attente du signal...</div>

        <div id="progress-bar">
            <div id="loading-progress"></div>
        </div>

        <div id="messages"></div>
    </div>

    <div id="music-box">
        <div class="music-icon">♫</div>
        <div class="music-info">
            <div class="music-title">Musique</div>
            <div id="music-name">...</div>
        </div>
    </div>

    <script src="js/lib/jquery-3.7.1.min.js"></script>
    <script src="js/lib/jquery.backstretch.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
